[package]
name = "beazt-tui"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
description = "Dogfood block explorer: TUI surface, generic over the domain's ChainReader port. Phase 1+, stub for now."

[dependencies]
beazt-domain = { path = "../beazt-domain" }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
beazt-zaino-client = { path = "../beazt-zaino-client" }
beazt-price-client = { path = "../beazt-price-client" }
jsonrpsee = { workspace = true, features = ["http-client"] }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
zaino-noderpc = { workspace = true }
zaino-service = { workspace = true, features = ["testing"] }
zaino-primitives = { workspace = true }
jsonrpsee = { workspace = true, features = ["server"] }
zcash_protocol.workspace = true
