[package]
name = "beazt-web"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
description = "Dogfood block explorer: server-rendered web surface, generic over the domain's ChainReader port."

[dependencies]
beazt-domain = { path = "../beazt-domain" }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
maud = { workspace = true }
tokio = { workspace = true }

# The binary's composition root alone: it is the one place that knows the
# concrete adapter(s). The library half of this crate (`src/lib.rs`) never
# imports any of these — it only knows the `ChainReader`/`PriceOracle`
# ports — only `src/bin/web.rs` does.
beazt-zaino-client = { path = "../beazt-zaino-client" }
beazt-price-client = { path = "../beazt-price-client" }
jsonrpsee = { workspace = true, features = ["http-client"] }

[dev-dependencies]
zaino-noderpc = { workspace = true }
zaino-service = { workspace = true, features = ["testing"] }
zaino-primitives = { workspace = true }
jsonrpsee = { workspace = true, features = ["server"] }
zcash_protocol.workspace = true
tower = { workspace = true }
http-body-util = "0.1.5"
