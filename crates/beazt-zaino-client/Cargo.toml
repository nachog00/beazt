[package]
name = "beazt-zaino-client"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
description = "Dogfood block explorer: the one production ChainReader, over zaino-noderpc's generated jsonrpsee client against a live zainod."

[dependencies]
beazt-domain = { path = "../beazt-domain" }
zaino-noderpc = { workspace = true }
jsonrpsee = { workspace = true, features = ["http-client"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
zaino-service = { workspace = true, features = ["testing"] }
zaino-primitives = { workspace = true }
jsonrpsee = { workspace = true, features = ["server"] }
zcash_protocol.workspace = true
tokio = { workspace = true }
